services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev-only-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-seat_reservation}
      MYSQL_USER: ${MYSQL_USER:-seat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev-only-password}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --binlog-format=ROW
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      # The app's database. Unset, it uses the local mysql service. Set APP_DB_* to use another MySQL (for example Railway).
      APP_DB_HOST: ${APP_DB_HOST:-mysql}
      APP_DB_PORT: ${APP_DB_PORT:-3306}
      APP_DB_NAME: ${APP_DB_NAME:-${MYSQL_DATABASE:-seat_reservation}}
      APP_DB_USER: ${APP_DB_USER:-${MYSQL_USER:-seat}}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-${MYSQL_PASSWORD:-dev-only-password}}
      APP_DB_JDBC_PARAMS: ${APP_DB_JDBC_PARAMS:-allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true}
      TOKEN_SECRET: ${TOKEN_SECRET:-dev-only-secret}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-only-admin-token}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-86400}
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_DB_POOL_SIZE: ${APP_DB_POOL_SIZE:-25}
      APP_DB_CONNECTION_TIMEOUT_MS: ${APP_DB_CONNECTION_TIMEOUT_MS:-25000}
      RESERVATION_MAX_ATTEMPTS: ${RESERVATION_MAX_ATTEMPTS:-5}
      RESERVATION_BASE_BACKOFF_MS: ${RESERVATION_BASE_BACKOFF_MS:-10}
      RESERVATION_MAX_BACKOFF_MS: ${RESERVATION_MAX_BACKOFF_MS:-200}
      RETRY_AFTER_SECONDS: ${RETRY_AFTER_SECONDS:-1}
      APP_RESERVATION_DEFAULT_MODE: ${APP_RESERVATION_DEFAULT_MODE:-all_or_nothing}
    volumes:
      - ./logs:/app/logs

volumes:
  mysql_data:
