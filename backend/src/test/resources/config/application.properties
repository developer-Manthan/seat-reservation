# Applies to tests only (Spring Boot also loads classpath:/config/application.properties, and it wins over the main file).
# Tests use their own schema on the local compose MySQL. They deliberately ignore APP_DB_*, so a shell or .env
# that points the app at a hosted database can never be hit by the test suite.
spring.datasource.url=jdbc:mysql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:3307}/${TEST_DB_NAME:seat_reservation_test}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${TEST_DB_USER:seat}
spring.datasource.password=${TEST_DB_PASSWORD:dev-only-password}
