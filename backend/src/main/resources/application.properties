spring.application.name=seat-reservation
server.port=${PORT:8080}

# Datasource (HikariCP: requests queue for a connection, they do not fail fast)
spring.datasource.url=jdbc:mysql://${APP_DB_HOST:localhost}:${APP_DB_PORT:3307}/${APP_DB_NAME:seat_reservation}?${APP_DB_JDBC_PARAMS:allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true}
spring.datasource.username=${APP_DB_USER:seat}
spring.datasource.password=${APP_DB_PASSWORD:dev-only-password}
spring.datasource.hikari.maximum-pool-size=${APP_DB_POOL_SIZE:25}
spring.datasource.hikari.connection-timeout=${APP_DB_CONNECTION_TIMEOUT_MS:25000}
spring.datasource.hikari.initialization-fail-timeout=${APP_DB_INIT_FAIL_TIMEOUT_MS:60000}

# JPA: Liquibase owns the schema, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Seat creation persists in chunks of this size (see JpaSeatInventoryRepository), sent as JDBC batches
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# Liquibase runs on startup
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Actuator: health stays open, metrics and prometheus need the admin token (enforced by AuthInterceptor)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.probes.enabled=true

# Auth: HMAC secret for user tokens, the admin token, and the user token lifetime (24h)
app.auth.token-secret=${TOKEN_SECRET:dev-only-secret}
app.auth.admin-token=${ADMIN_TOKEN:dev-only-admin-token}
app.auth.token-ttl-seconds=${TOKEN_TTL_SECONDS:86400}

# Show creation: maximum seats (rows x seats_per_row) per show
app.shows.max-seats=${APP_SHOWS_MAX_SEATS:5000}

# Readiness probe cap (the pool timeout is long, the probe must not hang)
app.readiness.timeout-ms=${READINESS_TIMEOUT_MS:2000}

# Reservations: all_or_nothing | best_effort
app.reservation.default-mode=${APP_RESERVATION_DEFAULT_MODE:all_or_nothing}

logging.level.root=${LOG_LEVEL:INFO}

# JSON strictness: money is whole paise, so 12.5 or "100" must be rejected, not rounded or coerced
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
