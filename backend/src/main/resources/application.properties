spring.application.name=seat-reservation
server.port=${PORT:8080}

# Datasource (HikariCP: requests queue for a connection, they do not fail fast)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:seat_reservation}?${DB_JDBC_PARAMS:allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:seat}
spring.datasource.password=${DB_PASSWORD:dev-only-password}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:25}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:25000}
spring.datasource.hikari.initialization-fail-timeout=${DB_INIT_FAIL_TIMEOUT_MS:60000}

# JPA: Liquibase owns the schema, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Liquibase runs on startup
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Actuator: health stays open, metrics and prometheus need the admin token (enforced by AuthInterceptor)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.probes.enabled=true

# Readiness probe cap (the pool timeout is long, the probe must not hang)
app.readiness.timeout-ms=${READINESS_TIMEOUT_MS:2000}

# Reservations: all_or_nothing | best_effort
app.reservation.default-mode=${APP_RESERVATION_DEFAULT_MODE:all_or_nothing}

logging.level.root=${LOG_LEVEL:INFO}
